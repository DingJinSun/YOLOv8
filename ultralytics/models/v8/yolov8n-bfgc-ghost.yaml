# YOLOv8n-BFGC-Ghost: BiFPN + GhostConv + C3Ghost + CBAM (完整论文一配方，最轻量)
# backbone 标准卷积 -> GhostConv, C2f -> C3Ghost; neck 同样替换; Concat -> BiFPN_Concat

nc: 80
depth_multiple: 0.33
width_multiple: 0.25

backbone:
  # [from, repeats, module, args]
  - [-1, 1, GhostConv, [64, 3, 2]]    # 0-P1/2
  - [-1, 1, GhostConv, [128, 3, 2]]   # 1-P2/4
  - [-1, 3, C3Ghost, [128, True]]     # 2
  - [-1, 1, GhostConv, [256, 3, 2]]   # 3-P3/8
  - [-1, 6, C3Ghost, [256, True]]     # 4
  - [-1, 1, GhostConv, [512, 3, 2]]   # 5-P4/16
  - [-1, 6, C3Ghost, [512, True]]     # 6
  - [-1, 1, GhostConv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C3Ghost, [1024, True]]    # 8
  - [-1, 1, SPPF, [1024, 5]]          # 9
  - [-1, 1, CBAM, [7]]                # 10-CBAM

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, BiFPN_Concat, [512]]   # 12
  - [-1, 3, C3Ghost, [512]]             # 13

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, BiFPN_Concat, [256]]   # 15
  - [-1, 3, C3Ghost, [256]]             # 16 (P3/8-small)

  - [-1, 1, GhostConv, [256, 3, 2]]     # 17
  - [[-1, 13], 1, BiFPN_Concat, [512]]  # 18
  - [-1, 3, C3Ghost, [512]]             # 19 (P4/16-medium)

  - [-1, 1, GhostConv, [512, 3, 2]]     # 20
  - [[-1, 10], 1, BiFPN_Concat, [1024]] # 21
  - [-1, 3, C3Ghost, [1024]]            # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]
