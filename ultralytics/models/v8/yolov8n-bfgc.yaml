# YOLOv8n-BFGC: YOLOv8n + BiFPN + GhostConv + CBAM
# Based on paper: 基于YOLOv8n改进的轻量化樱桃叶片病害检测模型

# Parameters
nc: 80  # number of classes (will be overridden by data config)
depth_multiple: 0.33  # scales module repeats
width_multiple: 0.25  # scales convolution channels

# YOLOv8n-BFGC backbone (same as YOLOv8n)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 3, C2f, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 6, C2f, [256, True]]        # 4
  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 6, C2f, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 3, C2f, [1024, True]]       # 8
  - [-1, 1, SPPF, [1024, 5]]        # 9
  - [-1, 1, CBAM, [7]]               # 10-CBAM attention (NEW!)

# YOLOv8n-BFGC head (BiFPN replaces Concat)
head:
  # === Top-down path (FPN) ===
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, BiFPN_Concat, [512]]  # 12-BiFPN weighted fusion (replaces Concat)
  - [-1, 3, C2f, [512]]                  # 13

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, BiFPN_Concat, [256]]  # 15-BiFPN weighted fusion (replaces Concat)
  - [-1, 3, C2f, [256]]                  # 16 (P3/8-small)

  # === Bottom-up path (PAN) ===
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, BiFPN_Concat, [512]] # 18-BiFPN weighted fusion (replaces Concat)
  - [-1, 3, C2f, [512]]                  # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, BiFPN_Concat, [1024]] # 21-BiFPN weighted fusion with CBAM output (replaces Concat)
  - [-1, 3, C2f, [1024]]                  # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]      # Detect(P3, P4, P5)
